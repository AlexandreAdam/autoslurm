[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "autoslurm-science-demo"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
typed = ["typer>=0.27,<0.28"]

[project.scripts]
science-demo = "science_demo:main"
science-typed = "typed_science_demo:app"

[tool.setuptools]
py-modules = ["science_demo", "typed_science_demo"]
